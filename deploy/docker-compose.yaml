services:
  bbs-wiki:
    container_name: ${CONTAINER_NAME:-bbs-wiki}
    image: ${REGISTRY_HOST:-}${IMAGE_NAME:-bbs-wiki}:${IMAGE_TAG:-latest}
    pull_policy: always
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "${PORT:-50030}:50030"
    environment:
      NODE_ENV: production
      PORT: 50030
      HOSTNAME: 0.0.0.0
